[project]
name = "malwarebazaar"
version = "0.2.10"
description = "CLI wrapper for malware bazaar API (bazaar.abuse.ch) and YARAify API (yaraify.abuse.ch)"
authors = [{ name = "3c7", email = "3c7@posteo.de" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.16"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Topic :: Security",
]

dependencies = [
  "requests (>=2.34.2)",
  "PyYAML (>=6.0.3)",
  "pyzipper (>=0.4.0)",
  "pydantic (>=2.13.4)",
]

[project.urls]
homepage = "https://github.com/3c7/bazaar"
repository = "https://github.com/3c7/bazaar"

[project.scripts]
bazaar = "malwarebazaar.bazaar:bazaar_app"
yaraify = "malwarebazaar.yaraify:yaraify_app"

[project.optional-dependencies]
cli = ["rich (>=15.0.0)", "click (>=8.3.3)", "typer (>=0.25.1)"]

[dependency-groups]
dev = ["types-PyYAML>=6.0.12.20260510", "types-requests>=2.33.0.20260513"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["malwarebazaar"]
